<div class="device" [class.device-on]="device.state">
  <mat-icon class="device-icon" [ngStyle]="{ color: iconColor }">
    {{ device.icon }}
  </mat-icon>

  <span class="device-label">{{ device.label }}</span>

  <mat-slide-toggle
    class="device-toggle"
    (click)="toggle()"
    [color]="statusColor"
    [checked]="device.state"
    [attr.aria-label]="'Toggle ' + device.label"
  ></mat-slide-toggle>
</div>
