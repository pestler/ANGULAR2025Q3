<div class="device" [class.device-on]="device.state">
  <mat-icon class="device-icon" [ngStyle]="{ color: iconColor }">
    {{ device.icon }}
  </mat-icon>

  <span class="device-label">{{ device.label }}</span>

  <mat-slide-toggle
    class="device-toggle"
    [color]="statusColor"
    [attr.aria-label]="'Toggle '"
  ></mat-slide-toggle>

  <!--  <p><mat-slide-toggle labelPosition="before"></mat-slide-toggle></p>
</div> -->
</div>
