<div class="device" [class.device-on]="device.state">
  <mat-icon>{{ device.icon }}</mat-icon>
  <span class="device-label">{{ device.label }}</span>
  <mat-slide-toggle
    mat-icon-button
    (click)="toggle()"
    [color]="statusColor"
    [attr.aria-label]="'Toggle ' + device.label"
  >
  </mat-slide-toggle>
  <!-- <mat-chip [color]="statusColor" selected>{{ statusLabel }}</mat-chip> -->
</div>
