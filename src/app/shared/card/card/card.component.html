<mat-card class="card" appearance="outlined" [ngClass]="getCardStyleClass()">
  <mat-card-title class="card-header">
    <div class="card-header-button">
      <span class="card-title">{{ card.title }}</span>
      <button mat-button *ngIf="devices.length" (click)="toggleGroup()">
        {{ getStatusLabel() }}
      </button>
    </div>

    <mat-divider />

    <div class="card-body" [ngSwitch]="layoutVariant">
      <div *ngSwitchCase="'single'" class="card-single">
        <app-device
          *ngIf="devices.length"
          [device]="devices[0]"
          (stateChanged)="onDeviceToggled(i)"
        />
        <app-sensor *ngIf="sensors.length" [sensor]="sensors[0]" />
      </div>

      <div *ngSwitchCase="'horizontal'" class="card-horizontal">
        <app-device
          class="card-h"
          *ngFor="let d of devices"
          [device]="d"
          (stateChanged)="onDeviceToggled(i)"
        />
        <app-sensor class="card-h" *ngFor="let s of sensors" [sensor]="s" />
      </div>

      <div *ngSwitchDefault class="card-vertical">
        <app-device
          class="card-v"
          *ngFor="let d of devices"
          [device]="d"
          (stateChanged)="onDeviceToggled(i)"
        />
        <app-sensor class="card-v" *ngFor="let s of sensors" [sensor]="s" />
      </div>
    </div>
  </mat-card-title>
</mat-card>
