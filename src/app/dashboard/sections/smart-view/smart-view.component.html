<mat-tab-group
  [selectedIndex]="selectedIndex()"
  (selectedIndexChange)="switchTab($event)"
>
  <mat-tab *ngFor="let tab of tabs(); let i = index" [label]="tab.id">
    <ng-container *ngIf="cards()?.length > 0; else emptyState">
      <app-card-list [cards]="cards()" />
    </ng-container>
  </mat-tab>
</mat-tab-group>

<ng-template #emptyState>
  <section class="empty-state">
    <p>No cards to display</p>
  </section>
</ng-template>
