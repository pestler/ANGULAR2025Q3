<mat-tab-group
  [selectedIndex]="selectedIndex()"
  (selectedIndexChange)="switchTab($event)"
>
  <mat-tab *ngFor="let tabId of tabIds()" [label]="tabId">
    <app-card-list [cards]="cards()"></app-card-list>
  </mat-tab>
</mat-tab-group>

<section class="smart-view" *ngIf="cards.length">
  <app-card-list class="app-card-list" [cards]="cards" />
</section>
