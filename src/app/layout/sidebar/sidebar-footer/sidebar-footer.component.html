<footer class="sidebar-footer">
  <div class="logout-container">
    <a
      class="logout-button"
      [routerLink]="['/login']"
      (click)="logout()"
      aria-label="Logout"
    >
      <mat-icon>logout</mat-icon>
      <span class="logout-label">Logout</span>
    </a>
  </div>

  <div class="user-info" *ngIf="auth.profile() as user">
    <div class="initials-circle">{{ user.initials }}</div>
    <div class="user-name">{{ user.fullName }}</div>
  </div>

  <div class="rs-container">
    <span class="rs-icon">RS</span>
    <span class="rs-label">
      <a href="https://rs.school/courses/angular" class="rs-link">
        RS School. Angular
      </a>
    </span>
  </div>
</footer>
