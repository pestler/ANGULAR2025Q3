<nav class="sidebar-menu" role="navigation" aria-label="Sidebar">
  @for (item of items(); track item.route) {
    <a
      [routerLink]="item.route"
      class="menu-item"
      [ngClass]="{ active: item === activeItem() }"
      [attr.aria-current]="item === activeItem() ? 'page' : null"
    >
      @if (item.icon) {
        <i [ngClass]="item.icon" aria-hidden="true"></i>
      }
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
